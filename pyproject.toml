[project]
name = "daily-game-challenge-be"
version = "0.1.0"
description = "Daily Game Challenge backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.19.1",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "boto3>=1.43.124",
  "email-validator>=2.3.0",
  "fastapi>=0.141.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "redis>=8.1.0",
  "sqlalchemy[asyncio]>=2.0.52",
  "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.4",
]

# Libraries only the content scripts need (app/content/, scripts/). `uv sync` installs both groups.
content = [
  "httpx>=0.28.1",
]

[tool.uv]
package = false
default-groups = ["dev", "content"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
